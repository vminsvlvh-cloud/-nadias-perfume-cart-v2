ifts.html" data-ar="الهدايا" data-en="Gifts"></a><a href="story.html" data-ar="قصتنا" data-en="Our Story"></a><a href="shipping.html" data-ar="الشحن" data-en="Shipping"></a><a href="shop.html?view=wishlist">♥ <span data-ar="المفضلة" data-en="Wishlist"></span> (<span data-wish-count>0</span>)</a></aside>
<section class="section"><div class="wrap event-hero">
  <div class="panel event-form">
    <div class="event-badge">NADIA’S BESPOKE EVENT CART</div>
    <h2 data-ar="عربة نادية للأعراس والمناسبات الفاخرة" data-en="Nadia’s Bespoke Event Cart"></h2>
    <p data-ar="خدمة تنسيق مخصصة للمناسبات، تبدأ بطلب الحجز ثم مراجعة التفاصيل والتواصل المباشر لتحديد التجربة المناسبة." data-en="A tailored event service that begins with a booking request, followed by detail review and direct coordination to shape the right experience."></p>
    <div class="event-steps">
      <div class="event-step"><b>01</b><span data-ar="أرسل تفاصيل المناسبة" data-en="Send event details"></span></div>
      <div class="event-step"><b>02</b><span data-ar="نراجع الطلب ونتواصل معك" data-en="We review and contact you"></span></div>
      <div class="event-step"><b>03</b><span data-ar="ننسق التفاصيل النهائية" data-en="We coordinate final details"></span></div>
    </div>
    <a class="btn gold" href="#eventBooking" style="margin-top:22px" data-ar="اطلب تنسيق المناسبة" data-en="Request event coordination"></a>
  </div>
  <div class="event-visual"><div class="event-mark">N<div><small>NADIA’S BESPOKE EVENT CART</small></div></div></div>
</div></section>

<section id="eventBooking" class="section"><div class="wrap checkout-grid">
<form id="eventForm" class="panel event-form">
  <div class="eyebrow">PRIVATE EVENT REQUEST</div>
  <h2 data-ar="طلب حجز وتنسيق" data-en="Booking & Coordination Request"></h2>
  <div id="eventSuccess"></div>

  <label data-ar="الاسم الكامل" data-en="Full name"></label>
  <input name="customer_name" required maxlength="120">

  <div class="two">
    <div><label data-ar="رقم الهاتف" data-en="Phone"></label><input name="phone" required maxlength="40"></div>
    <div><label data-ar="البريد الإلكتروني" data-en="Email"></label><input name="email" type="email" maxlength="160"></div>
  </div>

  <div class="two">
    <div><label data-ar="نوع المناسبة" data-en="Event type"></label>
      <select name="event_type" required>
        <option value="">—</option>
        <option value="wedding">Wedding / زفاف</option>
        <option value="engagement">Engagement / خطوبة</option>
        <option value="private_event">Private Event / مناسبة خاصة</option>
        <option value="corporate">Corporate / فعالية شركات</option>
        <option value="other">Other / أخرى</option>
      </select>
    </div>
    <div><label data-ar="تاريخ المناسبة" data-en="Event date"></label><input name="event_date" type="date" required></div>
  </div>

  <div class="two">
    <div><label data-ar="المدينة / المنطقة" data-en="City / Area"></label><input name="city" required maxlength="120"></div>
    <div><label data-ar="الموقع / القاعة" data-en="Venue"></label><input name="venue" maxlength="180"></div>
  </div>

  <div class="two">
    <div><label data-ar="عدد الضيوف المتوقع" data-en="Estimated guests"></label><input name="guest_count" type="number" min="1" max="10000"></div>
    <div><label data-ar="وقت المناسبة" data-en="Event time"></label><input name="event_time" type="time"></div>
  </div>

  <label data-ar="ما الذي ترغب في تنسيقه؟" data-en="What would you like coordinated?"></label>
  <textarea name="requirements" required maxlength="2000" data-placeholder-ar="اكتب تفاصيل العربة، العطور، الهدايا أو أي متطلبات خاصة..." data-placeholder-en="Tell us about the cart, fragrances, gifting or any special requirements..." placeholder="اكتب تفاصيل المناسبة والمتطلبات..."></textarea>

  <label data-ar="ملاحظات إضافية" data-en="Additional notes"></label>
  <textarea name="notes" maxlength="1000"></textarea>

  <label style="font-weight:400"><input name="contact_consent" type="checkbox" required style="width:auto"> <span data-ar="أوافق على التواصل معي بخصوص طلب المناسبة." data-en="I agree to be contacted about this event request."></span></label>

  <button class="btn gold" type="submit" data-ar="إرسال طلب التنسيق" data-en="Send coordination request"></button>
</form>

<aside class="panel">
  <div class="eyebrow">BESPOKE SERVICE</div>
  <h2 data-ar="تنسيق مباشر لكل مناسبة" data-en="Direct coordination for every event"></h2>
  <p data-ar="بعد إرسال النموذج، يظهر الطلب في لوحة إدارة Nadia’s مع بيانات المناسبة وحالة المتابعة. لا يتم تأكيد الحجز أو السعر تلقائياً؛ يتم ذلك بعد مراجعة التفاصيل والتواصل المباشر." data-en="After submitting the form, the request appears in Nadia’s admin dashboard with event details and follow-up status. Booking and pricing are not confirmed automatically; they are finalized after review and direct coordination."></p>
  <p class="muted" data-ar="لن نعرض أسعاراً أو باقات غير معتمدة. يمكن إضافتها لاحقاً عندما تحدد Nadia’s التفاصيل الفعلية للخدمة." data-en="No unapproved packages or prices are shown. They can be added later once Nadia’s defines the real service details."></p>
</aside>
