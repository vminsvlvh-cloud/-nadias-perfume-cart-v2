<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nadia’s Admin</title><link rel="stylesheet" href="styles.css?v=official-logo-1"></head><body class="admin-body">
<div id="login" class="login-box"><h1>Nadia’s Admin</h1><form onsubmit="login(event)"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><button class="btn gold" type="submit" style="margin-top:15px">Sign in</button><p id="loginMsg"></p></form></div>
<div id="app" class="admin-shell hidden"><div class="admin-top"><div><h1>Nadia’s Admin</h1><small>Products, announcement and orders</small></div><button class="btn danger" onclick="logout()">Sign out</button></div>
<div id="productEditor" class="admin-card hidden"><h2>Product</h2><form id="productForm" onsubmit="saveProduct(event)"><input id="pid" name="id" type="hidden"><div class="admin-grid"><div><label>Slug</label><input name="slug" required></div><div><label>Price EGP</label><input name="price" type="number" min="0" step=".01"></div><div><label>Arabic name</label><input name="name_ar" required></div><div><label>English name</label><input name="name_en" required></div><div><label>Stock</label><input name="stock" type="number" min="0"></div><div><label>Image URL</label><input name="image_url"></div></div><label>Arabic description</label><textarea name="description_ar"></textarea><label>English description</label><textarea name="description_en"></textarea><label><input name="active" type="checkbox" style="width:auto"> Active</label><div class="row"><button class="btn gold">Save</button><button type="button" onclick="document.getElementById('productEditor').classList.add('hidden')">Cancel</button></div></form></div>
<div class="admin-card"><div class="admin-top"><h2>Products</h2><button class="btn gold" onclick="newProduct()">+ Add product</button></div><div style="overflow:auto"><table class="admin-table"><thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Active</th><th></th></tr></thead><tbody id="productsBody"></tbody></table></div></div>
<div class="admin-card"><h2>Announcement</h2><form onsubmit="saveAnnouncement(event)"><input id="annId" type="hidden"><label>Arabic</label><input id="annAr"><label>English</label><input id="annEn"><label><input id="annActive" type="checkbox" style="width:auto"> Active</label><br><button class="btn gold">Save announcement</button></form></div>
<div class="admin-card"><h2>Bespoke Event Cart Requests</h2><p>Wedding & luxury event coordination requests.</p><div style="overflow:auto"><table class="admin-table"><thead><tr><th>Reference</th><th>Client</th><th>Event</th><th>Date / City</th><th>Guests</th><th>Status</th><th>Requirements</th></tr></thead><tbody id="eventsBody"></tbody></table></div></div>
<div class="admin-card"><h2>Orders</h2><div style="overflow:auto"><table class="admin-table"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody id="ordersBody"></tbody></table></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
