<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nadia V2 Admin</title><link rel="stylesheet" href="styles.css"></head><body><main class="section"><div class="wrap"><h2 style="color:#caa56b">Nadia’s V2 Admin</h2><div id="loginCard" class="panel"><label>البريد الإلكتروني</label><input id="email" type="email"><label>كلمة المرور</label><input id="password" type="password"><button class="btn gold" onclick="login()">دخول</button><div id="status"></div></div><div id="dash" class="hidden"><div class="panel"><h3>لوحة الإدارة</h3><p id="who"></p><button onclick="logout()">خروج</button></div><div class="panel" style="margin-top:18px"><h3>إضافة منتج</h3><label>Slug</label><input id="slug"><label>الاسم العربي</label><input id="name_ar"><label>English name</label><input id="name_en"><label>السعر EGP</label><input id="price" type="number" step="0.01"><label>المخزون</label><input id="stock" type="number" min="0" value="0"><button class="btn gold" onclick="saveProduct()">حفظ</button><div id="saveStatus"></div></div><div class="panel" style="margin-top:18px"><h3>المنتجات</h3><div id="adminProducts"></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const sb=supabase.createClient(window.NADIA_SUPABASE.url,window.NADIA_SUPABASE.anonKey);
async function login(){const {data,error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)return status.textContent=error.message;if(data.user?.app_metadata?.role!=='admin'){await sb.auth.signOut();return status.textContent='هذا الحساب ليس Admin';}loginCard.classList.add('hidden');dash.classList.remove('hidden');who.textContent=data.user.email;loadProducts();}
async function saveProduct(){const row={slug:slug.value.trim(),name_ar:name_ar.value.trim(),name_en:name_en.value.trim(),price:price.value?Number(price.value):null,stock:Number(stock.value||0),active:true};const {error}=await sb.from('products').insert(row);saveStatus.textContent=error?error.message:'تم الحفظ';if(!error)loadProducts();}
async function loadProducts(){const {data,error}=await sb.from('products').select('*').order('created_at');adminProducts.textContent=error?error.message:'';if(data)adminProducts.innerHTML=data.map(p=>`<div class="cart-item"><span>${p.name_ar} / ${p.name_en}</span><span>${p.price??'-'} EGP</span></div>`).join('')||'لا توجد منتجات بعد';}
async function logout(){await sb.auth.signOut();location.reload();}
</script></body></html>
