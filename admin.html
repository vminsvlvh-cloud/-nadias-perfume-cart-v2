<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-ar="إدارة نادية" data-en="Nadia’s Admin">إدارة نادية</title><script>(function(){var l='ar';try{l=localStorage.getItem('nadia_lang')==='en'?'en':'ar'}catch(e){}document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr'})()</script><link rel="stylesheet" href="styles.css?v=20260921-product-images-6"><script src="language.js?v=20260921-product-images-6"></script></head><body class="admin-body"><button class="btn" data-language-toggle onclick="toggleLang()">EN</button>
<div id="login" class="login-box"><h1 data-ar="إدارة نادية" data-en="Nadia’s Admin">إدارة نادية</h1><form onsubmit="login(event)"><label data-ar="البريد الإلكتروني" data-en="Email">البريد الإلكتروني</label><input name="email" type="email" required><label data-ar="كلمة المرور" data-en="Password">كلمة المرور</label><input name="password" type="password" required><button class="btn gold" type="submit" style="margin-top:15px" data-ar="تسجيل الدخول" data-en="Sign in">تسجيل الدخول</button><p id="loginMsg"></p></form></div>
<div id="app" class="admin-shell hidden"><div class="admin-top"><div><h1 data-ar="إدارة نادية" data-en="Nadia’s Admin">إدارة نادية</h1><small data-ar="المنتجات والإعلان والطلبات" data-en="Products, announcement and orders">المنتجات والإعلان والطلبات</small></div><button class="btn danger" onclick="logout()" data-ar="تسجيل الخروج" data-en="Sign out">تسجيل الخروج</button></div>
<div id="productEditor" class="admin-card hidden"><h2 data-ar="المنتج" data-en="Product">المنتج</h2><form id="productForm" onsubmit="saveProduct(event)"><input id="pid" name="id" type="hidden"><div class="admin-grid"><div><label data-ar="معرّف الرابط" data-en="Slug">معرّف الرابط</label><input name="slug" required></div><div><label data-ar="السعر بالجنيه المصري" data-en="Price EGP">السعر بالجنيه المصري</label><input name="price" type="number" min="0" step=".01"></div><div><label data-ar="الاسم بالعربية" data-en="Arabic name">الاسم بالعربية</label><input name="name_ar" required></div><div><label data-ar="الاسم بالإنجليزية" data-en="English name">الاسم بالإنجليزية</label><input name="name_en" required></div><div><label data-ar="المخزون" data-en="Stock">المخزون</label><input name="stock" type="number" min="0"></div><div><label data-ar="رابط الصورة" data-en="Image URL">رابط الصورة</label><input name="image_url"></div></div><label data-ar="الوصف بالعربية" data-en="Arabic description">الوصف بالعربية</label><textarea name="description_ar"></textarea><label data-ar="الوصف بالإنجليزية" data-en="English description">الوصف بالإنجليزية</label><textarea name="description_en"></textarea><label><input name="active" type="checkbox" style="width:auto"> <span data-ar="نشط" data-en="Active">نشط</span></label><div class="row"><button class="btn gold" data-ar="حفظ" data-en="Save">حفظ</button><button type="button" onclick="document.getElementById('productEditor').classList.add('hidden')" data-ar="إلغاء" data-en="Cancel">إلغاء</button></div></form></div>
<div class="admin-card"><div class="admin-top"><h2 data-ar="المنتجات" data-en="Products">المنتجات</h2><button class="btn gold" onclick="newProduct()" data-ar="+ إضافة منتج" data-en="+ Add product">+ إضافة منتج</button></div><div style="overflow:auto"><table class="admin-table"><thead><tr><th data-ar="الاسم" data-en="Name">الاسم</th><th data-ar="السعر" data-en="Price">السعر</th><th data-ar="المخزون" data-en="Stock">المخزون</th><th data-ar="نشط" data-en="Active">نشط</th><th></th></tr></thead><tbody id="productsBody"></tbody></table></div></div>
<div class="admin-card"><h2 data-ar="الإعلان" data-en="Announcement">الإعلان</h2><form onsubmit="saveAnnouncement(event)"><input id="annId" type="hidden"><label data-ar="العربية" data-en="Arabic">العربية</label><input id="annAr"><label data-ar="الإنجليزية" data-en="English">الإنجليزية</label><input id="annEn"><label><input id="annActive" type="checkbox" style="width:auto"> <span data-ar="نشط" data-en="Active">نشط</span></label><br><button class="btn gold" data-ar="حفظ الإعلان" data-en="Save announcement">حفظ الإعلان</button></form></div>
<div class="admin-card"><h2 data-ar="طلبات عربة المناسبات" data-en="Bespoke Event Cart Requests">طلبات عربة المناسبات</h2><p data-ar="طلبات تنسيق الأعراس والمناسبات الفاخرة." data-en="Wedding &amp; luxury event coordination requests.">طلبات تنسيق الأعراس والمناسبات الفاخرة.</p><div style="overflow:auto"><table class="admin-table"><thead><tr><th data-ar="رقم الطلب" data-en="Reference">رقم الطلب</th><th data-ar="العميل" data-en="Client">العميل</th><th data-ar="المناسبة" data-en="Event">المناسبة</th><th data-ar="التاريخ / المدينة" data-en="Date / City">التاريخ / المدينة</th><th data-ar="الضيوف" data-en="Guests">الضيوف</th><th data-ar="الحالة" data-en="Status">الحالة</th><th data-ar="المتطلبات" data-en="Requirements">المتطلبات</th></tr></thead><tbody id="eventsBody"></tbody></table></div></div>
<div class="admin-card"><h2 data-ar="الطلبات" data-en="Orders">الطلبات</h2><div style="overflow:auto"><table class="admin-table"><thead><tr><th data-ar="الطلب" data-en="Order">الطلب</th><th data-ar="العميل" data-en="Customer">العميل</th><th data-ar="الإجمالي" data-en="Total">الإجمالي</th><th data-ar="الحالة" data-en="Status">الحالة</th><th data-ar="التاريخ" data-en="Date">التاريخ</th></tr></thead><tbody id="ordersBody"></tbody></table></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260921-product-images-6"></script><script src="admin.js?v=20260921-product-images-6"></script></body></html>
